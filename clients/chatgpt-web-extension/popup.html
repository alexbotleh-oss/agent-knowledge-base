<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Восстановление хода</title>
<style>
body{font:14px/1.45 system-ui,sans-serif;width:360px;max-width:95vw;margin:0;padding:14px;color:#202124}
h1{font-size:18px;margin:0 0 8px}p{margin:6px 0}.muted{color:#5f6368;font-size:12px}
button{border:1px solid #aaa;border-radius:7px;background:#f8f9fa;padding:8px 10px;margin:5px 4px 5px 0}
.card{border:1px solid #dadce0;border-radius:9px;padding:10px;margin:10px 0;overflow-wrap:anywhere}
.state{font-weight:600}.message{white-space:pre-wrap;max-height:120px;overflow:auto;background:#f7f7f7;padding:7px;border-radius:5px}
</style>
</head>
<body>
<h1>Незавершённые ходы</h1>
<p class="muted">Локальный журнал браузера. Тексты не отправляются на внешний сервер.</p>
<div id="status">Читаю журнал…</div>
<section class="card">
  <strong>Краткосрочная память диалога</strong>
  <p class="muted">Последние пять пар глобально и последние пять пар текущего чата. Контекст копируется только по нажатию; он не отправляется автоматически.</p>
  <div id="memory-status" class="muted">Готовлю окна…</div>
  <button id="copy-memory">Скопировать контекст диалога</button>
</section>
<div id="turns"></div>
<button id="refresh">Обновить</button>
<button id="export">Экспорт журнала JSONL</button>
<script src="popup.js"></script>
</body>
</html>
